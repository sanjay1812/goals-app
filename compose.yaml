version: '3.8'
services:
  mongodb:
    image: 'mongo'
    volumes:
      - data:/data/db
  
  node-backend:
    build: ./backend
    ports:
      - '8080:80'
    depends_on:
      - mongodb

  react-frontend:
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - node-backend

volumes:
  data: